name: Prepare real wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$REPOSITORY.git"
          git -c credential.helper='!gh auth git-credential' fetch --depth=1 origin "$REVISION"
          git checkout -b main FETCH_HEAD
      - name: Generate wrapper with real Gradle 9.7.1 twice
        run: |
          # First replace the bootstrap distribution, then run the target Gradle twice.
          ./gradlew wrapper --gradle-version 9.7.1 --gradle-distribution-sha256-sum acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a --no-daemon
          ./gradlew wrapper --gradle-version 9.7.1 --gradle-distribution-sha256-sum acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a --no-daemon
          ./gradlew wrapper --gradle-version 9.7.1 --gradle-distribution-sha256-sum acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a --no-daemon
          echo '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Check
        run: ./gradlew check --no-daemon
      - name: Save the real wrapper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name leanish
          git config user.email 5417585+leanish@users.noreply.github.com
          git add gradlew gradlew.bat gradle/wrapper
          git commit -m 'generating the fixture wrapper with gradle 9.7.1'
          git -c credential.helper='!gh auth git-credential' push origin main
