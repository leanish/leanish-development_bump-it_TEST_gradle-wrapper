name: supply-chain

on:
  pull_request:
    # `edited` covers a retargeted base, which changes what the gate compares against.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    uses: leanish/leanish-development/.github/workflows/supply-chain.yml@86f5f226cc82927d0f86193c8bc86f94f8996fb6 # v0.9.0
    permissions:
      contents: read
    with:
      java-version: "17"
